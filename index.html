<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>JioTV Plus Web</title>
    <!-- Favicon & Logo -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/PvknKR5R/07e1dc7f1e03.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --c1: #ff1ad9; --c2: #ff4da6; --c3: #00e0ff;
            --bg: #03000d; --card-bg: #0d0a1f;
            --glass: rgba(18,16,45,0.7); --border: rgba(255,26,217,0.3);
            --text: #f0e6ff; --muted: #9d8abf; --radius: 24px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh; padding: 1rem;
            user-select: none; -webkit-user-select: none;
        }
        .app { max-width: 1600px; margin:0 auto; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo img {
            height: 2.4rem; width: auto; border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,26,217,0.4);
        }
        .logo h1 {
            font-size: 1.7rem; font-weight: 800;
            background: linear-gradient(135deg, var(--c1), var(--c3));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-right {
            display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
        }
        .search-box {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 50px; padding: 0.4rem 1.2rem;
            display: flex; align-items: center; gap: 0.4rem;
            backdrop-filter: blur(10px);
        }
        .search-box i { color: var(--muted); }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: white; font-size: 0.9rem; width: 180px;
        }
        .search-box input::placeholder { color: #5e668a; }
        .icon-btn {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 50%; width: 40px; height: 40px; display: flex;
            align-items: center; justify-content: center; color: var(--muted);
            cursor: pointer; transition: 0.2s; backdrop-filter: blur(10px);
            position: relative;
        }
        .icon-btn:hover { color: white; border-color: var(--c1); }
        .bookmark-badge {
            position: absolute; top: -6px; right: -6px;
            background: #e12d4a; color: white; font-size: 0.65rem;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }
        .telegram-btn {
            background: linear-gradient(135deg, #00b0ff, #0088cc);
            color: white; border: none; border-radius: 50px;
            padding: 0.5rem 1.2rem; font-weight: 700; text-decoration: none;
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.85rem; box-shadow: 0 0 15px rgba(0,176,255,0.5);
            transition: 0.2s;
        }
        .telegram-btn:hover { transform: scale(1.03); box-shadow: 0 0 25px rgba(0,176,255,0.8); }

        .cat-shell {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 40px; padding: 0.7rem 1rem; margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
        }
        .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
        .cat-chip {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--muted); border-radius: 40px; padding: 0.4rem 1rem;
            font-size: 0.8rem; cursor: pointer; font-weight: 500; transition: 0.2s;
        }
        .cat-chip:hover { background: rgba(255,255,255,0.1); color: white; }
        .cat-chip.active {
            background: var(--c1); color: white; border-color: var(--c1);
            box-shadow: 0 0 12px var(--c1);
        }
        .toggle-cat {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            border-radius: 40px; padding: 0.4rem 1rem; font-size: 0.8rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .toggle-cat:hover { color: white; border-color: var(--c1); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem 0.5rem 0.8rem;
            display: flex; flex-direction: column; align-items: center;
            position: relative; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card:hover {
            transform: translateY(-5px); border-color: var(--c1);
            box-shadow: 0 12px 30px rgba(255,26,217,0.2);
        }
        .card-logo {
            width: 80px; height: 80px; border-radius: 20px;
            background: rgba(255,255,255,0.05); display: flex;
            align-items: center; justify-content: center; margin-bottom: 0.6rem;
            overflow: hidden;
        }
        .card-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-name {
            font-weight: 600; font-size: 0.85rem; text-align: center;
            color: var(--text); word-break: break-word; line-height: 1.2;
        }
        .card-badge {
            margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
        }
        .hd-badge {
            background: #e12d4a; color: white; font-size: 0.6rem; font-weight: 800;
            padding: 2px 6px; border-radius: 30px; letter-spacing: 0.5px;
        }
        .cat-mini {
            background: rgba(255,255,255,0.1); color: #b8c4ff;
            font-size: 0.6rem; padding: 2px 6px; border-radius: 30px;
        }
        .bookmark-icon {
            position: absolute; top: 8px; right: 10px; color: #8e9ad4;
            font-size: 0.9rem; cursor: pointer; z-index: 5;
        }
        .bookmark-icon.active { color: #fbbf24; }

        .empty { grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--muted); }

        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: stretch; }
            .header-right { justify-content: flex-end; }
            .search-box input { width: 130px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <!-- Replace bolt icon with the provided logo image -->
            <img src="https://i.ibb.co/PvknKR5R/07e1dc7f1e03.jpg" alt="JioTV Plus Web logo">
            <h1>JioTV Plus Web</h1>
        </div>
        <div class="header-right">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search channels...">
            </div>
            <div class="icon-btn" id="bookmarkBtn">
                <i class="fas fa-bookmark"></i>
                <span class="bookmark-badge" id="bookmarkCount">0</span>
            </div>
            <a href="https://t.me/teamsterniters" target="_blank" class="telegram-btn">
                <i class="fab fa-telegram"></i> Join Now
            </a>
        </div>
    </div>

    <div class="cat-shell">
        <div class="cats" id="categories"></div>
        <button class="toggle-cat" id="toggleCat"><i class="fas fa-layer-group"></i> <span id="toggleText">Expand</span></button>
    </div>

    <div class="grid" id="channelGrid"></div>
</div>

<script>
(function(){
    const API = 'https://newjiomblive.bmera5952.workers.dev/';
    let channels = [], filtered = [];
    let bookmarks = JSON.parse(localStorage.getItem('sterniters_bm') || '[]');
    let activeCat = 'All';
    let catsExpanded = false;
    let showBookmarks = false;
    let securityEnabled = false;

    const grid = document.getElementById('channelGrid');
    const catDiv = document.getElementById('categories');
    const search = document.getElementById('searchInput');
    const toggleBtn = document.getElementById('toggleCat');
    const toggleText = document.getElementById('toggleText');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const bookmarkCount = document.getElementById('bookmarkCount');

    function updateBookmarkCount() { bookmarkCount.textContent = bookmarks.length; }

    function categoryFromName(name) {
        const n = String(name || '').toLowerCase();
        if (/news|aaj tak|ndtv|republic|bbc|cnn|times now|india today|abp|wion|cnbc|samachar/.test(n)) return 'News';
        if (/sport|cricket|football|ipl|tennis|wwe|nba|f1|kabaddi|eurosport/.test(n)) return 'Sports';
        if (/music|mtv|mastii|b4u|9xm|vh1|zing|gaana/.test(n)) return 'Music';
        if (/kid|cartoon|pogo|nick|disney|hungama|sonic|cbeebies/.test(n)) return 'Kids';
        if (/devotional|aastha|sanskar|bhakti|spiritual|darshan|satsang/.test(n)) return 'Devotional';
        if (/movie|cinema|gold|sony max|hbo|pictures|filmy|box office/.test(n)) return 'Movies';
        return 'Entertainment';
    }

    function normalizeChannels(data) {
        // The new API can return a bare array, or { channels: [...] }.
        const list = Array.isArray(data) ? data : (Array.isArray(data?.channels) ? data.channels : []);
        return list.map((ch, index) => ({
            ...ch,
            id: String(ch.id ?? ch.channelId ?? index),
            name: String(ch.name || ch.title || `Channel ${index + 1}`),
            logo: ch.logo || ch.image || '',
            mpd: ch.mpd || ch.url || ch.streamUrl || '',
            keyId: ch.keyId || ch.kid || '',
            key: ch.key || '',
            cookie: ch.cookie || '',
            // This API doesn't reliably supply a clean category string, so derive one from the name
            // when it's missing — same fallback the source app used.
            category: ch.category?.trim() || categoryFromName(ch.name || ch.title)
        })).filter(ch => ch.mpd);
    }

    async function loadChannels() {
        try {
            const res = await fetch(API);
            const data = await res.json();
            channels = normalizeChannels(data);
            if (!channels.length) throw new Error('No playable channels returned');
            updateBookmarkCount();
            renderCategories();
            filterAndRender();
            setTimeout(enableSecurity, 2000);
        } catch(e) {
            grid.innerHTML = '<div class="empty">⚠️ Could not load channels.</div>';
        }
    }

    function extractCategories() {
        const set = new Set();
        channels.forEach(c => { if (c.category) set.add(c.category.trim()); });
        return ['All', ...Array.from(set).sort()];
    }

    function renderCategories() {
        const allCats = extractCategories();
        const visible = catsExpanded ? allCats : allCats.slice(0,1);
        catDiv.innerHTML = visible.map(cat =>
            `<span class="cat-chip ${activeCat === cat ? 'active' : ''}" data-cat="${cat}">${cat}</span>`
        ).join('');
        document.querySelectorAll('.cat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                activeCat = chip.dataset.cat;
                showBookmarks = false;
                bookmarkBtn.classList.remove('active');
                renderCategories();
                filterAndRender();
            });
        });
        toggleText.textContent = catsExpanded ? 'Show less' : 'Expand';
    }

    toggleBtn.onclick = () => {
        catsExpanded = !catsExpanded;
        renderCategories();
    };

    function filterAndRender() {
        let query = search.value.trim().toLowerCase();
        let temp = [...channels];
        if (showBookmarks) {
            temp = temp.filter(c => bookmarks.includes(c.id || c.name));
        } else if (activeCat !== 'All') {
            temp = temp.filter(c => c.category === activeCat);
        }
        if (query) temp = temp.filter(c => c.name?.toLowerCase().includes(query));
        filtered = temp;
        renderGrid(temp);
    }

    function renderGrid(list) {
        let html = '';
        list.forEach(ch => {
            const chId = ch.id || ch.name;
            const bookmarked = bookmarks.includes(chId);
            const logo = ch.logo || 'https://via.placeholder.com/80?text=📺';
            const hasHD = ch.mpd && (ch.mpd.includes('HD') || ch.mpd.includes('1080') || ch.mpd.includes('720'));
            html += `
                <div class="card" data-id="${chId}" data-name="${ch.name || ''}">
                    <span class="bookmark-icon ${bookmarked ? 'active' : ''}" data-id="${chId}"><i class="fa${bookmarked ? 's' : 'r'} fa-bookmark"></i></span>
                    <div class="card-logo"><img src="${logo}" alt="" loading="lazy"></div>
                    <div class="card-name">${ch.name || ''}</div>
                    <div class="card-badge">
                        ${hasHD ? '<span class="hd-badge">HD</span>' : ''}
                        ${ch.category ? '<span class="cat-mini">'+ch.category.slice(0,12)+'</span>' : ''}
                    </div>
                </div>`;
        });
        if (list.length === 0) html = '<div class="empty">📭 No channels</div>';
        grid.innerHTML = html;

        document.querySelectorAll('.bookmark-icon').forEach(icon => {
            icon.addEventListener('click', e => {
                e.stopPropagation();
                const id = icon.dataset.id;
                const idx = bookmarks.indexOf(id);
                if (idx > -1) bookmarks.splice(idx,1);
                else bookmarks.push(id);
                localStorage.setItem('sterniters_bm', JSON.stringify(bookmarks));
                updateBookmarkCount();
                if (showBookmarks) filterAndRender();
                else {
                    const cardIcon = icon.querySelector('i');
                    if (cardIcon) {
                        cardIcon.className = idx > -1 ? 'far fa-bookmark' : 'fas fa-bookmark';
                        icon.classList.toggle('active');
                    }
                }
            });
        });

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', e => {
                if (e.target.closest('.bookmark-icon')) return;
                const id = card.dataset.id;
                const channel = channels.find(c => String(c.id) === String(id));
                if (channel) openPlayer(channel);
            });
        });
    }

    function encodePayload(value) {
        const bytes = new TextEncoder().encode(JSON.stringify(value));
        let binary = '';
        bytes.forEach(byte => binary += String.fromCharCode(byte));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function openPlayer(channel) {
        // Some streams carry a signed token inside the cookie string (__hdnea__=...).
        const token = String(channel.cookie || '').match(/__hdnea__=([^;]+)/)?.[1] || '';
        const payload = {
            id: channel.id, name: channel.name, logo: channel.logo,
            streamUrl: channel.mpd, keyId: channel.keyId, key: channel.key,
            cookie: channel.cookie, token, category: channel.category
        };
        window.open(`player.html#${encodePayload(payload)}`, '_blank');
    }

    bookmarkBtn.addEventListener('click', () => {
        if (bookmarks.length === 0) {
            alert('No bookmarks yet! Click the bookmark icon on any channel.');
            return;
        }
        showBookmarks = !showBookmarks;
        bookmarkBtn.classList.toggle('active', showBookmarks);
        if (showBookmarks) activeCat = 'All';
        renderCategories();
        filterAndRender();
    });

    let timer;
    search.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(filterAndRender, 200);
    });

    function enableSecurity() {
        if (securityEnabled) return;
        securityEnabled = true;
        const THRESHOLD = 160;
        let devtoolsOpen = false;
        function detectDevTools() {
            return (window.outerWidth - window.innerWidth > THRESHOLD) ||
                   (window.outerHeight - window.innerHeight > THRESHOLD);
        }
        function destroyPage() {
            if (devtoolsOpen) return;
            devtoolsOpen = true;
            window.fetch = function(){ return Promise.reject(new Error('Blocked')); };
            XMLHttpRequest.prototype.open = function(){};
            XMLHttpRequest.prototype.send = function(){};
            document.documentElement.innerHTML = '';
            document.body.innerHTML = '<div style="color:red;font-size:24px;text-align:center;margin-top:20vh;">⛔ SECURITY VIOLATION – DevTools forbidden</div>';
            throw new Error('DevTools detected');
        }
        if (detectDevTools()) destroyPage();
        setInterval(() => { if (!devtoolsOpen && detectDevTools()) destroyPage(); }, 100);
        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && e.keyCode === 85) ||
                (e.ctrlKey && e.keyCode === 83) ||
                (e.ctrlKey && e.keyCode === 80) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I')
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('paste', e => e.preventDefault());
        setInterval(function(){ try { (function(){}).constructor('debugger')(); } catch(e) {} }, 100);
        setInterval(function(){
            console.clear();
            console.log = console.warn = console.error = console.info = console.debug = function(){};
        }, 1500);
        if (window.top !== window.self) window.top.location.replace(window.self.location.href);
    }

    loadChannels();
})();
</script>

<!-- All ad scripts have been removed as requested -->
</body>
</html>
